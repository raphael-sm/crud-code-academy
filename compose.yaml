services:
  api:
    build: API/
    ports:
      - "8000:80"
    depends_on:
      - database

  frontend:
    build: FrontEnd/
    ports:
      - "5500:80"

  database:
    image: mysql:8.4
    ports:
      - "${DB_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Backup:/docker-entrypoint-initdb.d/

volumes:
  mysql-data:
